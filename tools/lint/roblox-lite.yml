# Offline stand-in for selene's generated Roblox standard library.
# CI uses the real `std = "roblox"` (selene downloads the API dump there); this file lets
# `selene --config tools/lint/selene-local.toml src` run without network access. It only
# declares the globals as `any`, so it catches undefined names, not misspelled members.
base: luau
globals:
  game: { any: true }
  workspace: { any: true }
  script: { any: true }
  plugin: { any: true }
  shared: { any: true }
  Instance: { any: true }
  Vector2: { any: true }
  Vector2int16: { any: true }
  Vector3: { any: true }
  Vector3int16: { any: true }
  CFrame: { any: true }
  Color3: { any: true }
  BrickColor: { any: true }
  ColorSequence: { any: true }
  ColorSequenceKeypoint: { any: true }
  NumberSequence: { any: true }
  NumberSequenceKeypoint: { any: true }
  NumberRange: { any: true }
  UDim: { any: true }
  UDim2: { any: true }
  Rect: { any: true }
  Ray: { any: true }
  Region3: { any: true }
  Region3int16: { any: true }
  Font: { any: true }
  Enum: { any: true }
  EnumItem: { any: true }
  TweenInfo: { any: true }
  RaycastParams: { any: true }
  OverlapParams: { any: true }
  PhysicalProperties: { any: true }
  Random: { any: true }
  DateTime: { any: true }
  Axes: { any: true }
  Faces: { any: true }
  PathWaypoint: { any: true }
  FloatCurveKey: { any: true }
  RotationCurveKey: { any: true }
  CatalogSearchParams: { any: true }
  task: { any: true }
  tick: { any: true }
  time: { any: true }
  elapsedTime: { any: true }
  warn: { any: true }
  typeof: { any: true }
  settings: { any: true }
  UserSettings: { any: true }
  debug: { any: true }
  utf8: { any: true }
  bit32: { any: true }
  buffer: { any: true }
  vector: { any: true }
  DebuggerManager: { any: true }
  version: { any: true }
